<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rafflex preview</title>
    <link rel="stylesheet" href="/__rafflex/app.css">
    <script type="module" src="/__rafflex/app.js"></script>
</head>
<body>
    <header class="toolbar">
        <div class="toolbar-title">
            <a href="/" class="back">All products</a>
            <strong id="project-title">Rafflex preview</strong>
            <span id="project-type" class="muted"></span>
        </div>

        <div class="toolbar-controls">
            <label class="control" id="scenario-control">
                <span>Scenario</span>
                <select id="scenario"></select>
            </label>

            <label class="control" id="play-count-control">
                <span>Plays</span>
                <input id="play-count" type="number" inputmode="numeric">
            </label>

            <div class="segmented" role="group" aria-label="Device width">
                <button type="button" data-device="mobile">Phone</button>
                <button type="button" data-device="tablet">Tablet</button>
                <button type="button" data-device="desktop">Desktop</button>
            </div>
        </div>
    </header>

    <main class="stage">
        <div id="frame-wrapper" class="frame-wrapper">
            <iframe id="preview" title="Template preview" sandbox="allow-scripts"></iframe>
        </div>
    </main>

    <section id="problems" class="problems" aria-live="polite">
        <button type="button" id="problems-toggle" class="problems-toggle" aria-expanded="false">
            <span id="problems-summary">Checking</span>
        </button>
        <div id="problems-body" class="problems-body" hidden>
            <ul id="warnings" class="warnings"></ul>
            <ul id="problem-list" class="problem-list"></ul>
            <p class="note" id="verdict-note"></p>
        </div>
    </section>
</body>
</html>
